[project]
name = "py-online-cinema"
version = "0.1.0"
description = "A FastAPI-based Online Cinema API for managing movies, favorites, ratings, shopping cart, and orders."
authors = [
    {name = "Danil Tatarchuk",email = "tatarchuk.danil06@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.3,<0.53.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
