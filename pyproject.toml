[project]
name = "py-online-cinema"
version = "0.1.0"
description = "A FastAPI-based Online Cinema API for managing movies, favorites, ratings, shopping cart, and orders."
authors = [
    {name = "Danil Tatarchuk",email = "tatarchuk.danil06@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.3,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "greenlet (>=3.5.5,<4.0.0)",
    "email-validator (>=2.3.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]
